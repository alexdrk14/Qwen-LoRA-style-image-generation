pretrained_model_name_or_path: Qwen/Qwen-Image

data_config:
  train_batch_size: 1
  num_workers: 0
  img_size: 1024
  caption_dropout_rate: 0.1
  img_dir: ./processed_dataset
  random_ratio: true
  caption_type: txt

report_to: null
train_batch_size: 1
output_dir: ./test_lora_saves
max_train_steps: 900
learning_rate: 2e-4
lr_scheduler: cosine
lr_warmup_steps: 90

adam_beta1: 0.9
adam_beta2: 0.999
adam_weight_decay: 0.01
adam_epsilon: 1e-8
max_grad_norm: 1.0

logging_dir: logs
mixed_precision: "bf16"
checkpointing_steps: 100
checkpoints_total_limit: 10
tracker_project_name: lora_test
resume_from_checkpoint: latest
gradient_accumulation_steps: 16  # Effective batch = 16

rank: 128
network_alpha: 128

precompute_text_embeddings: true
precompute_image_embeddings: true
save_cache_on_disk: true
quantize: false
adam8bit: false